name: social-media

# Shared env for the API and worker (in-container hostnames).
# Secrets (SECRET_KEY, S3 keys, SMTP creds) MUST come from a local .env file
# or the host environment — they are intentionally not committed here. Copy
# .env.example.backend to .env.backend and fill in the values before `compose up`.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/social_media
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:5173
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_URL: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: media

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_media
    ports:
      # Host 5433 → container 5432 (host 5432 often taken by a native Postgres).
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the media bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/media &&
      mc anonymous set download local/media &&
      echo 'bucket ready'
      "

  # Mailpit: catches outgoing dev email (SMTP :1025, web UI :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_MAX_MESSAGES: '500'

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    env_file:
      - .env.backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    env_file:
      - .env.backend
    volumes:
      - ./backend:/app
    command: arq app.worker.WorkerSettings

volumes:
  pgdata:
  miniodata:
